# Theme for the AquaHealth AI demo (app/main.py): dark aquatic base; the design system
# in app/theme.py builds on these colours. No usage statistics are sent.
[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#070d1a"
secondaryBackgroundColor = "#0e1a2e"
textColor = "#e6f1ff"
font = "sans serif"

[server]
maxUploadSize = 20
enableXsrfProtection = true

[browser]
gatherUsageStats = false
