[project]
name = "aquahealth-ai"
version = "0.1.0"
description = "AI-Based Smart Aquaculture Disease Detection"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Colab notebooks mix shell magics with Python; they are orchestration, not library code.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
